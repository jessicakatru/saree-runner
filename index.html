<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Saree Runner</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0e1a12;font-family:system-ui,sans-serif;touch-action:none}
  #hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;color:#fff;font-size:20px;font-weight:600;pointer-events:none;text-shadow:0 2px 6px #0008}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;background:#0008;cursor:pointer}
  #msg h1{margin:0 0 8px;font-size:40px}
  #msg p{margin:4px 0;opacity:.9}
  #msg button{margin-top:18px;padding:12px 28px;font-size:18px;border:0;border-radius:999px;background:#c8e86b;color:#122;font-weight:700;cursor:pointer}
  #loading{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#fff8;font-size:13px}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="hud"><div>Score: <span id="score">0</span></div><div>Coins: <span id="coins">0</span></div><div>Best: <span id="best">0</span></div></div>
<div id="msg">
  <h1>Saree Runner</h1>
  <p>Collect coins, avoid the crates</p>
  <p>← → / A D : move &nbsp; | &nbsp; Space / ↑ : jump</p>
  <p>Mobile: swipe left/right, tap to jump</p>
  <button id="startBtn">Start</button>
</div>
<div id="loading">Loading models…</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ===== CONFIG (change these if needed) =====
const MODELS = { player: 'models/player.glb', obstacle: 'models/obstacle.glb', coin: 'models/coin.glb' };
const PLAYER_HEIGHT = 1.8;     // model sizes in game units
const OBSTACLE_HEIGHT = 1.0;
const COIN_SIZE = 0.7;
const PLAYER_ROTATE = Math.PI;// if the character runs backwards, change to 0
const LANES = [-2.2, 0, 2.2];
// ===========================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd8ef);
scene.fog = new THREE.Fog(0x9fd8ef, 25, 70);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 4.2, 7);
camera.lookAt(0, 1, -6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x446644, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(5, 10, 6);
scene.add(sun);

// Ground (scrolling stripes)
const groundTex = (() => {
  const c = document.createElement('canvas'); c.width = 64; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#5aa84a'; g.fillRect(0, 0, 64, 128);
  g.fillStyle = '#62b551'; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 30);
  t.magFilter = THREE.NearestFilter;
  return t;
})();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 300), new THREE.MeshLambertMaterial({ map: groundTex }));
ground.rotation.x = -Math.PI / 2; ground.position.z = -100;
scene.add(ground);
const path = new THREE.Mesh(new THREE.PlaneGeometry(7.4, 300), new THREE.MeshLambertMaterial({ color: 0xd9c08a }));
path.rotation.x = -Math.PI / 2; path.position.set(0, 0.01, -100);
scene.add(path);

// ---------- Model loading with fallbacks ----------
const loader = new GLTFLoader();

function normalize(obj, targetSize, useHeight = true) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const base = useHeight ? size.y : Math.max(size.x, size.y, size.z);
  const s = targetSize / (base || 1);
  const wrap = new THREE.Group();
  obj.scale.multiplyScalar(s);
  const b2 = new THREE.Box3().setFromObject(obj);
  const c = b2.getCenter(new THREE.Vector3());
  obj.position.x -= c.x; obj.position.z -= c.z; obj.position.y -= b2.min.y;
  wrap.add(obj);
  return wrap;
}

function loadModel(url, targetSize, fallback, useHeight = true) {
  return new Promise(res => {
    loader.load(url,
      gltf => res({ obj: normalize(gltf.scene, targetSize, useHeight), real: true }),
      undefined,
      () => { console.warn('Using placeholder for', url); res({ obj: fallback(), real: false }); });
  });
}

const fbPlayer = () => { const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 0.9, 4, 10), new THREE.MeshLambertMaterial({ color: 0x2f9e44 })); body.position.y = 0.85;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), new THREE.MeshLambertMaterial({ color: 0xf1c27d })); head.position.y = 1.6;
  g.add(body, head); return g; };
const fbObstacle = () => { const m = new THREE.Mesh(new THREE.BoxGeometry(1.3, OBSTACLE_HEIGHT, 1.3), new THREE.MeshLambertMaterial({ color: 0x8b5a2b })); m.position.y = OBSTACLE_HEIGHT / 2; const g = new THREE.Group(); g.add(m); return g; };
const fbCoin = () => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.08, 20), new THREE.MeshLambertMaterial({ color: 0xffc400 })); m.rotation.x = Math.PI / 2; m.position.y = 0.35; const g = new THREE.Group(); g.add(m); return g; };

const [P, O, C] = await Promise.all([
  loadModel(MODELS.player, PLAYER_HEIGHT, fbPlayer),
  loadModel(MODELS.obstacle, OBSTACLE_HEIGHT, fbObstacle),
  loadModel(MODELS.coin, COIN_SIZE, fbCoin, false)
]);
document.getElementById('loading').textContent =
  `Models: player ${P.real ? '✓' : 'placeholder'}, obstacle ${O.real ? '✓' : 'placeholder'}, coin ${C.real ? '✓' : 'placeholder'}`;
setTimeout(() => document.getElementById('loading').remove(), 4000);

const player = new THREE.Group();
P.obj.rotation.y = P.real ? PLAYER_ROTATE : 0;
player.add(P.obj);
scene.add(player);

// ---------- Game state ----------
let state = 'menu', lane = 1, vy = 0, y = 0, speed, score, coins, spawnT, items = [];
let best = +localStorage.getItem('saree-best') || 0;
const $ = id => document.getElementById(id);
$('best').textContent = best;

function reset() {
  items.forEach(i => scene.remove(i.mesh)); items = [];
  lane = 1; y = 0; vy = 0; speed = 12; score = 0; coins = 0; spawnT = 0;
  player.position.set(LANES[1], 0, 0);
}

function spawn() {
  const l = Math.floor(Math.random() * 3);
  const isObs = Math.random() < 0.55;
  const mesh = (isObs ? O : C).obj.clone(true);
  mesh.position.set(LANES[l], 0, -70);
  scene.add(mesh);
  items.push({ mesh, lane: l, type: isObs ? 'obs' : 'coin' });
  // sometimes a trail of coins
  if (!isObs && Math.random() < 0.6) for (let k = 1; k < 4; k++) {
    const m = C.obj.clone(true); m.position.set(LANES[l], 0, -70 - k * 2.2); scene.add(m);
    items.push({ mesh: m, lane: l, type: 'coin' });
  }
}

function start() { reset(); state = 'play'; $('msg').style.display = 'none'; }
function gameOver() {
  state = 'over';
  if (score > best) { best = score; localStorage.setItem('saree-best', best); $('best').textContent = best; }
  $('msg').innerHTML = `<h1>Game Over</h1><p>Score: ${score} &nbsp; Coins: ${coins}</p><button id="startBtn">Play again</button>`;
  $('msg').style.display = 'flex'; $('startBtn').onclick = start;
}
$('startBtn').onclick = start;

function jump() { if (state === 'play' && y === 0) vy = 9; }
function move(d) { if (state === 'play') lane = Math.max(0, Math.min(2, lane + d)); }

addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') move(-1);
  if (e.key === 'ArrowRight' || e.key === 'd') move(1);
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); jump(); }
  if ((e.key === 'Enter') && state !== 'play') start();
});
let tx = 0, ty = 0;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1);
  else if (dy < -40) jump(); else if (Math.abs(dx) < 15) jump();
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- Loop ----------
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  if (state === 'play') {
    speed += dt * 0.25;
    score += Math.floor(speed * dt * 1.2);
    groundTex.offset.y += speed * dt / 10;

    player.position.x += (LANES[lane] - player.position.x) * Math.min(1, dt * 12);
    vy -= 24 * dt; y += vy * dt; if (y <= 0) { y = 0; vy = 0; }
    player.position.y = y;
    player.rotation.z = (LANES[lane] - player.position.x) * -0.12;

    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.55, 1.3 - speed * 0.02); }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i]; it.mesh.position.z += speed * dt;
      if (it.type === 'coin') it.mesh.rotation.y += dt * 4;
      const dz = Math.abs(it.mesh.position.z), dx = Math.abs(it.mesh.position.x - player.position.x);
      if (dz < 0.9 && dx < 0.9) {
        if (it.type === 'coin') { coins++; score += 25; scene.remove(it.mesh); items.splice(i, 1); continue; }
        if (y < OBSTACLE_HEIGHT * 0.8) { gameOver(); break; }
      }
      if (it.mesh.position.z > 10) { scene.remove(it.mesh); items.splice(i, 1); }
    }
    $('score').textContent = score; $('coins').textContent = coins;
  } else {
    player.position.y = Math.sin(t * 3) * 0.05; // idle bob
  }
  renderer.render(scene, camera);
}
reset();
tick();
</script>
</body>
</html>
